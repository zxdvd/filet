[package]
name = "filet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
yaml_serde = "=0.10.7"
rusqlite = { version = "0.38", features = ["bundled"] }
globset = "0.4"
walkdir = "2.5"
fs2 = "0.4"
filetime = "0.2"
schemars = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
