[workspace]
members = ["crates/filet-core", "crates/filet-js", "crates/filet-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Explainable local file automation with YAML and JavaScript"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.20"
filet-core = { path = "crates/filet-core" }
filet-js = { path = "crates/filet-js" }

[profile.release]
lto = "thin"
strip = true

