name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Record native toolchain
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          if command -v cc >/dev/null 2>&1; then cc --version; fi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native tests
        run: cargo test --workspace --locked
      - name: LaunchAgent helper
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: CLI examples
        shell: bash
        run: |
          cargo run --locked --bin filet -- check -c examples/yaml/filet.yaml --json
          cargo run --locked --bin filet -- check -c examples/js/filet.yaml --json
          cargo run --locked --bin filet -- test -c examples/yaml/filet.yaml examples/yaml/fixtures.json --json
